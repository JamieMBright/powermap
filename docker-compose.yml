# docker-compose.yml
version: '3.8'

services:
  powermap:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - UKPN_ODP_API_KEY=${UKPN_ODP_API_KEY}
      - UKPN_ODP_BASE_URL=${UKPN_ODP_BASE_URL}
    env_file:
      - .env.local
    restart: unless-stopped

  # Development mode with hot reload
  powermap-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    env_file:
      - .env.local
    profiles:
      - dev
