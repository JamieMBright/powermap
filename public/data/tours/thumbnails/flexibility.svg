<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" fill="none">
  <!-- Sky gradient background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d4a6f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5568;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:1" />
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Green glow for EV -->
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="400" height="160" fill="url(#skyGradient)"/>

  <!-- Ground -->
  <rect y="160" width="400" height="65" fill="url(#groundGradient)"/>

  <!-- House silhouette in background -->
  <g transform="translate(20, 90)">
    <rect x="0" y="30" width="60" height="40" fill="#2d3748"/>
    <polygon points="0,30 30,5 60,30" fill="#374151"/>
    <rect x="10" y="45" width="15" height="20" fill="#1a202c"/>
    <rect x="35" y="40" width="15" height="15" fill="#1a202c"/>
    <!-- Solar panels on roof -->
    <rect x="8" y="12" width="20" height="12" fill="#4a5568"/>
    <rect x="32" y="12" width="20" height="12" fill="#4a5568"/>
    <g fill="#06b6d4" opacity="0.3">
      <rect x="10" y="14" width="7" height="8"/>
      <rect x="19" y="14" width="7" height="8"/>
      <rect x="34" y="14" width="7" height="8"/>
      <rect x="43" y="14" width="7" height="8"/>
    </g>
  </g>

  <!-- House 2 -->
  <g transform="translate(310, 95)">
    <rect x="0" y="25" width="50" height="35" fill="#2d3748"/>
    <polygon points="0,25 25,5 50,25" fill="#374151"/>
    <rect x="8" y="38" width="12" height="18" fill="#1a202c"/>
    <rect x="28" y="35" width="12" height="12" fill="#1a202c"/>
  </g>

  <!-- EV Charging Station -->
  <g transform="translate(140, 100)">
    <!-- Charging post -->
    <rect x="0" y="0" width="20" height="50" fill="#374151" rx="3"/>
    <rect x="3" y="5" width="14" height="20" fill="#1a202c"/>
    <!-- Screen with charge indicator -->
    <rect x="5" y="8" width="10" height="14" fill="#22c55e" filter="url(#greenGlow)" opacity="0.8"/>
    <!-- Lightning bolt icon -->
    <polygon points="9,10 11,10 10,14 12,14 8,20 9,16 7,16" fill="#fff"/>
    <!-- Cable connection point -->
    <circle cx="10" cy="35" r="4" fill="#4a5568"/>
    <circle cx="10" cy="35" r="2" fill="#22c55e" filter="url(#glow)"/>
  </g>

  <!-- Electric Vehicle -->
  <g transform="translate(100, 135)">
    <!-- Car body -->
    <path d="M 10,20 L 15,5 L 55,5 L 70,20 L 80,20 L 80,35 L 0,35 L 0,20 Z" fill="#3b82f6"/>
    <!-- Windows -->
    <path d="M 18,8 L 22,18 L 50,18 L 50,8 Z" fill="#1a202c" opacity="0.8"/>
    <path d="M 52,8 L 52,18 L 65,18 L 60,8 Z" fill="#1a202c" opacity="0.8"/>
    <!-- Wheels -->
    <circle cx="20" cy="35" r="8" fill="#1a202c"/>
    <circle cx="20" cy="35" r="5" fill="#4a5568"/>
    <circle cx="60" cy="35" r="8" fill="#1a202c"/>
    <circle cx="60" cy="35" r="5" fill="#4a5568"/>
    <!-- Charging port with glow -->
    <rect x="42" y="22" width="8" height="5" fill="#22c55e" filter="url(#greenGlow)"/>
  </g>

  <!-- Charging cable -->
  <g stroke="#22c55e" stroke-width="3" fill="none" filter="url(#greenGlow)">
    <path d="M 150 135 Q 140 145, 150 155" stroke-opacity="0.8"/>
  </g>

  <!-- Second EV Charging Station -->
  <g transform="translate(230, 105)">
    <rect x="0" y="0" width="18" height="45" fill="#374151" rx="3"/>
    <rect x="3" y="5" width="12" height="18" fill="#1a202c"/>
    <rect x="5" y="8" width="8" height="12" fill="#f97316" filter="url(#glow)" opacity="0.6"/>
    <circle cx="9" cy="32" r="3" fill="#4a5568"/>
  </g>

  <!-- Second EV (waiting) -->
  <g transform="translate(200, 138)">
    <path d="M 8,18 L 12,5 L 45,5 L 55,18 L 62,18 L 62,30 L 0,30 L 0,18 Z" fill="#8b5cf6"/>
    <path d="M 15,7 L 18,16 L 40,16 L 40,7 Z" fill="#1a202c" opacity="0.8"/>
    <circle cx="15" cy="30" r="6" fill="#1a202c"/>
    <circle cx="15" cy="30" r="4" fill="#4a5568"/>
    <circle cx="47" cy="30" r="6" fill="#1a202c"/>
    <circle cx="47" cy="30" r="4" fill="#4a5568"/>
  </g>

  <!-- Power flow arrows (bidirectional V2G) -->
  <g fill="#22c55e" filter="url(#greenGlow)">
    <!-- Arrow pointing to grid -->
    <polygon points="92,120 85,125 85,115" opacity="0.8"/>
    <polygon points="102,115 95,120 102,125" opacity="0.8"/>
  </g>

  <!-- Grid connection symbol -->
  <g transform="translate(50, 115)">
    <circle cx="15" cy="15" r="12" fill="#374151" stroke="#22c55e" stroke-width="2"/>
    <text x="15" y="20" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="12" font-weight="bold">V2G</text>
  </g>

  <!-- Smart meter / control unit -->
  <g transform="translate(280, 135)">
    <rect x="0" y="0" width="30" height="25" fill="#374151" rx="2"/>
    <rect x="3" y="3" width="24" height="12" fill="#1a202c"/>
    <rect x="5" y="5" width="20" height="8" fill="#06b6d4" opacity="0.4" filter="url(#glow)"/>
    <circle cx="8" cy="20" r="2" fill="#22c55e" filter="url(#glow)"/>
    <circle cx="15" cy="20" r="2" fill="#22c55e" filter="url(#glow)"/>
    <circle cx="22" cy="20" r="2" fill="#f97316" filter="url(#glow)"/>
  </g>

  <!-- Orange accent glow at horizon -->
  <ellipse cx="200" cy="160" rx="150" ry="20" fill="#22c55e" opacity="0.1"/>

  <!-- Title text -->
  <text x="200" y="200" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">
    Smart Flexibility Services
  </text>
  <text x="200" y="218" text-anchor="middle" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">
    Colchester - V2G &amp; Smart Charging
  </text>
</svg>
