<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" fill="none">
  <!-- Sky gradient background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d4a6f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5568;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:1" />
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Screen glow -->
    <filter id="screenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="400" height="160" fill="url(#skyGradient)"/>

  <!-- Ground -->
  <rect y="160" width="400" height="65" fill="url(#groundGradient)"/>

  <!-- Data Centre Building -->
  <g transform="translate(80, 70)">
    <!-- Main building structure -->
    <rect x="0" y="30" width="240" height="60" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
    <!-- Roof -->
    <polygon points="0,30 120,-5 240,30" fill="#374151"/>
    <!-- HVAC units on roof -->
    <rect x="30" y="5" width="25" height="20" fill="#4a5568"/>
    <rect x="70" y="5" width="25" height="20" fill="#4a5568"/>
    <rect x="145" y="5" width="25" height="20" fill="#4a5568"/>
    <rect x="185" y="5" width="25" height="20" fill="#4a5568"/>
    <!-- Spinning fans -->
    <circle cx="42" cy="15" r="8" fill="#1a202c"/>
    <circle cx="82" cy="15" r="8" fill="#1a202c"/>
    <circle cx="157" cy="15" r="8" fill="#1a202c"/>
    <circle cx="197" cy="15" r="8" fill="#1a202c"/>
    <!-- Server room windows with blue glow -->
    <g filter="url(#screenGlow)">
      <rect x="20" y="45" width="30" height="35" fill="#1a202c"/>
      <rect x="22" y="47" width="26" height="31" fill="#06b6d4" opacity="0.3"/>
      <rect x="60" y="45" width="30" height="35" fill="#1a202c"/>
      <rect x="62" y="47" width="26" height="31" fill="#06b6d4" opacity="0.3"/>
      <rect x="110" y="45" width="30" height="35" fill="#1a202c"/>
      <rect x="112" y="47" width="26" height="31" fill="#06b6d4" opacity="0.3"/>
      <rect x="150" y="45" width="30" height="35" fill="#1a202c"/>
      <rect x="152" y="47" width="26" height="31" fill="#06b6d4" opacity="0.3"/>
      <rect x="190" y="45" width="30" height="35" fill="#1a202c"/>
      <rect x="192" y="47" width="26" height="31" fill="#06b6d4" opacity="0.3"/>
    </g>
    <!-- Server rack indicators (blinking lights) -->
    <g>
      <circle cx="28" cy="55" r="2" fill="#22c55e" filter="url(#glow)"/>
      <circle cx="28" cy="62" r="2" fill="#22c55e" filter="url(#glow)"/>
      <circle cx="28" cy="69" r="2" fill="#f97316" filter="url(#glow)"/>
      <circle cx="68" cy="55" r="2" fill="#22c55e" filter="url(#glow)"/>
      <circle cx="68" cy="62" r="2" fill="#22c55e" filter="url(#glow)"/>
      <circle cx="68" cy="69" r="2" fill="#22c55e" filter="url(#glow)"/>
      <circle cx="118" cy="55" r="2" fill="#22c55e" filter="url(#glow)"/>
      <circle cx="118" cy="62" r="2" fill="#f97316" filter="url(#glow)"/>
      <circle cx="118" cy="69" r="2" fill="#22c55e" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Power connection from pylon -->
  <g transform="translate(340, 50)">
    <!-- Small pylon -->
    <polygon points="15,80 25,80 30,0 10,0" fill="#374151"/>
    <polygon points="10,0 30,0 25,-15 15,-15" fill="#4a5568"/>
    <rect x="-5" y="-10" width="50" height="3" fill="#4a5568"/>
    <rect x="0" y="10" width="40" height="3" fill="#4a5568"/>
    <!-- Insulators -->
    <circle cx="0" cy="-10" r="3" fill="#f97316" filter="url(#glow)"/>
    <circle cx="40" cy="-10" r="3" fill="#f97316" filter="url(#glow)"/>
  </g>

  <!-- Power cables to building -->
  <g stroke="#f97316" stroke-width="2" fill="none" filter="url(#glow)">
    <path d="M 340 42 Q 300 60, 280 100" stroke-opacity="0.9"/>
    <path d="M 378 42 Q 340 65, 310 100" stroke-opacity="0.9"/>
    <path d="M 340 60 Q 310 75, 290 100" stroke="#fb923c" stroke-opacity="0.7"/>
  </g>

  <!-- Transformer/Substation box -->
  <g transform="translate(290, 120)">
    <rect x="0" y="0" width="40" height="30" fill="#374151" stroke="#4a5568"/>
    <circle cx="20" cy="-5" r="6" fill="#f97316" filter="url(#glow)"/>
    <rect x="5" y="8" width="12" height="15" fill="#1a202c"/>
    <rect x="22" y="8" width="12" height="15" fill="#1a202c"/>
  </g>

  <!-- Orange accent glow at horizon -->
  <ellipse cx="200" cy="160" rx="150" ry="20" fill="#06b6d4" opacity="0.1"/>

  <!-- Title text -->
  <text x="200" y="200" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">
    Hyperscale Datacentre Connection
  </text>
  <text x="200" y="218" text-anchor="middle" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">
    Lea Valley - 2029
  </text>
</svg>
