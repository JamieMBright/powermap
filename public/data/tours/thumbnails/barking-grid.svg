<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" fill="none">
  <!-- Sky gradient background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d4a6f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5568;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:1" />
    </linearGradient>
    <!-- Glow effect for power lines -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="400" height="160" fill="url(#skyGradient)"/>

  <!-- Ground -->
  <rect y="160" width="400" height="65" fill="url(#groundGradient)"/>

  <!-- Distant city silhouette -->
  <g fill="#1a202c" opacity="0.6">
    <rect x="20" y="130" width="15" height="30"/>
    <rect x="40" y="120" width="12" height="40"/>
    <rect x="60" y="135" width="10" height="25"/>
    <rect x="320" y="125" width="18" height="35"/>
    <rect x="345" y="140" width="12" height="20"/>
    <rect x="360" y="130" width="15" height="30"/>
  </g>

  <!-- Electricity Pylon 1 (left, smaller - distance) -->
  <g fill="#4a5568" transform="translate(60, 100)">
    <!-- Pylon structure -->
    <polygon points="25,60 35,60 38,0 22,0" fill="#374151"/>
    <polygon points="22,0 38,0 32,-15 28,-15" fill="#4a5568"/>
    <!-- Cross arms -->
    <rect x="5" y="-10" width="50" height="3" fill="#4a5568"/>
    <rect x="10" y="5" width="40" height="3" fill="#4a5568"/>
    <rect x="15" y="20" width="30" height="2" fill="#4a5568"/>
    <!-- Insulators -->
    <circle cx="8" cy="-10" r="2" fill="#f59e0b"/>
    <circle cx="52" cy="-10" r="2" fill="#f59e0b"/>
    <circle cx="12" cy="5" r="2" fill="#f59e0b"/>
    <circle cx="48" cy="5" r="2" fill="#f59e0b"/>
  </g>

  <!-- Electricity Pylon 2 (center, larger) -->
  <g fill="#4a5568" transform="translate(170, 65)">
    <!-- Pylon base structure -->
    <polygon points="30,95 50,95 58,0 22,0" fill="#374151"/>
    <polygon points="22,0 58,0 48,-25 32,-25" fill="#4a5568"/>
    <!-- Cross arms -->
    <rect x="0" y="-18" width="80" height="4" fill="#4a5568"/>
    <rect x="8" y="5" width="64" height="4" fill="#4a5568"/>
    <rect x="15" y="30" width="50" height="3" fill="#4a5568"/>
    <!-- Insulators with glow -->
    <g filter="url(#glow)">
      <circle cx="5" cy="-18" r="3" fill="#f97316"/>
      <circle cx="75" cy="-18" r="3" fill="#f97316"/>
      <circle cx="12" cy="5" r="3" fill="#f97316"/>
      <circle cx="68" cy="5" r="3" fill="#f97316"/>
    </g>
  </g>

  <!-- Electricity Pylon 3 (right, smaller - distance) -->
  <g fill="#4a5568" transform="translate(300, 105)">
    <!-- Pylon structure -->
    <polygon points="20,55 30,55 33,0 17,0" fill="#374151"/>
    <polygon points="17,0 33,0 28,-12 22,-12" fill="#4a5568"/>
    <!-- Cross arms -->
    <rect x="3" y="-8" width="44" height="3" fill="#4a5568"/>
    <rect x="8" y="5" width="34" height="3" fill="#4a5568"/>
    <!-- Insulators -->
    <circle cx="6" cy="-8" r="2" fill="#f59e0b"/>
    <circle cx="44" cy="-8" r="2" fill="#f59e0b"/>
  </g>

  <!-- Power lines connecting pylons -->
  <g stroke="#f97316" stroke-width="2" fill="none" filter="url(#glow)">
    <!-- Top lines -->
    <path d="M 68 92 Q 210 75, 175 47" stroke-opacity="0.9"/>
    <path d="M 175 47 Q 250 55, 306 97" stroke-opacity="0.9"/>
    <path d="M 108 92 Q 210 78, 250 70" stroke-opacity="0.9"/>
    <path d="M 250 70 Q 290 80, 344 97" stroke-opacity="0.9"/>
    <!-- Lower lines -->
    <path d="M 72 105 Q 180 95, 178 70" stroke="#fb923c" stroke-opacity="0.7"/>
    <path d="M 178 70 Q 260 85, 308 110" stroke="#fb923c" stroke-opacity="0.7"/>
  </g>

  <!-- Substation in foreground -->
  <g transform="translate(140, 165)">
    <!-- Building -->
    <rect x="0" y="0" width="120" height="40" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
    <rect x="5" y="5" width="30" height="15" fill="#1a202c"/>
    <rect x="40" y="5" width="30" height="15" fill="#1a202c"/>
    <rect x="85" y="8" width="25" height="25" fill="#374151"/>
    <!-- Equipment -->
    <rect x="95" y="-15" width="8" height="20" fill="#4a5568"/>
    <circle cx="99" cy="-20" r="5" fill="#f97316" filter="url(#glow)"/>
    <!-- Fence -->
    <line x1="-10" y1="40" x2="130" y2="40" stroke="#4a5568" stroke-width="1"/>
  </g>

  <!-- Orange accent glow at horizon -->
  <ellipse cx="200" cy="160" rx="150" ry="20" fill="#f97316" opacity="0.15"/>

  <!-- Title text -->
  <text x="200" y="200" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">
    Grid Reinforcement Project
  </text>
  <text x="200" y="218" text-anchor="middle" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">
    East London - 2028
  </text>
</svg>
