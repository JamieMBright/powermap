  <!-- AC side (left) -->
  <path d="M6 16 Q8 12, 10 16 Q12 20, 14 16" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <!-- DC side (right) -->
  <line x1="18" y1="12" x2="26" y2="12" stroke="#ef4444" stroke-width="2"/>
  <line x1="18" y1="20" x2="26" y2="20" stroke="#ef4444" stroke-width="2"/>
  <!-- Converter box -->
