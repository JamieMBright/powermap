<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Transformer icon (two coils) -->
  <circle cx="16" cy="16" r="14" fill="white" stroke="#333" stroke-width="1.5"/>
  <!-- Primary coil (left) -->
  <circle cx="11" cy="16" r="6" fill="none" stroke="#7A7A85" stroke-width="2"/>
  <!-- Secondary coil (right) -->
  <circle cx="21" cy="16" r="6" fill="none" stroke="#7A7A85" stroke-width="2"/>
  <!-- Connection line -->
  <line x1="5" y1="16" x2="8" y2="16" stroke="#333" stroke-width="1.5"/>
  <line x1="24" y1="16" x2="27" y2="16" stroke="#333" stroke-width="1.5"/>
</svg>
