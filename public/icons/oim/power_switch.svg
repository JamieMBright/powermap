<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Switch/circuit breaker icon -->
  <circle cx="16" cy="16" r="14" fill="white" stroke="#333" stroke-width="1.5"/>
  <!-- Switch symbol -->
  <circle cx="10" cy="16" r="2" fill="#ef4444"/>
  <circle cx="22" cy="16" r="2" fill="#ef4444"/>
  <!-- Connection lines -->
  <line x1="4" y1="16" x2="8" y2="16" stroke="#333" stroke-width="2"/>
  <line x1="24" y1="16" x2="28" y2="16" stroke="#333" stroke-width="2"/>
  <!-- Switch blade (open position) -->
  <line x1="12" y1="16" x2="20" y2="10" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
</svg>
